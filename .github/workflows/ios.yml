name: iOS 工程与核心包

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODEGEN_VERSION: "2.45.4"

jobs:
  core-linux:
    name: 核心包测试（Linux）
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test --package-path Packages/AntKingdomCore

  ios-simulator:
    name: Xcode 构建与模拟器测试（macOS）
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        run: bash ci/select-xcode.sh

      - name: 安装锁定版本的 XcodeGen
        run: |
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: 记录构建环境
        run: bash ci/record-environment.sh build/environment.md && cat build/environment.md >> "$GITHUB_STEP_SUMMARY"

      - name: 工程未手改漂移（重新生成后与提交一致）
        run: |
          xcodegen generate --spec ios/project.yml
          if [ -n "$(git status --porcelain -- ios/)" ]; then
            git status --porcelain -- ios/
            git diff -- ios/ | head -n 200
            mkdir -p build/regenerated && cp -R ios/AntKingdom.xcodeproj build/regenerated/
            echo "::error::ios/AntKingdom.xcodeproj 与 project.yml 重新生成的结果不一致；运行 xcodegen generate --spec ios/project.yml 后提交"
            exit 1
          fi

      - name: 核心包测试（macOS）
        run: swift test --package-path Packages/AntKingdomCore

      - name: Python ↔ Swift 差分报告
        run: |
          mkdir -p build
          swift run --package-path Packages/AntKingdomCore ak-sim > build/swift_core.json
          python3 tools/diff_core.py build/swift_core.json build/core-diff.md > /dev/null
          cat build/core-diff.md >> "$GITHUB_STEP_SUMMARY"

      - name: 列出 scheme
        run: xcodebuild -list -project ios/AntKingdom.xcodeproj

      - name: 单元 + UI 测试（标准尺寸模拟器）
        run: |
          udid=$(python3 ci/pick_simulator.py standard 2>build/sim-standard.txt)
          echo "- 标准尺寸模拟器：$(cat build/sim-standard.txt)" >> "$GITHUB_STEP_SUMMARY"
          echo "SIM_STANDARD=$udid" >> "$GITHUB_ENV"
          bash ci/xcodebuild.sh -project ios/AntKingdom.xcodeproj -scheme AntKingdom \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/AntKingdom.xcresult \
            CODE_SIGNING_ALLOWED=NO test

      - name: 导出 UI 测试截图附件
        if: always()
        run: |
          mkdir -p build/attachments
          if [ -d build/AntKingdom.xcresult ]; then
            xcrun xcresulttool export attachments --path build/AntKingdom.xcresult --output-path build/attachments || true
          fi
          ls -la build/attachments || true

      - name: 录制 Pantry 操作录像（模拟器）
        timeout-minutes: 12
        run: |
          mkdir -p build/videos
          xcrun simctl io "$SIM_STANDARD" recordVideo --codec h264 --force build/videos/C05-pantry-flow.mov &
          rec=$!
          sleep 2
          status=0
          bash ci/xcodebuild.sh -project ios/AntKingdom.xcodeproj -scheme AntKingdom             -destination "platform=iOS Simulator,id=$SIM_STANDARD"             -derivedDataPath build/DerivedData             -only-testing:AntKingdomUITests/PantryFlowUITests             CODE_SIGNING_ALLOWED=NO test-without-building || status=$?
          kill -INT "$rec" || true
          wait "$rec" || true
          ls -la build/videos
          exit $status

      - name: UI 测试（小屏 iPhone SE，最旧已安装 iOS 运行时）
        timeout-minutes: 20
        run: |
          small=$(python3 ci/pick_simulator.py small 2>build/sim-small.txt)
          echo "- 小屏模拟器：$(cat build/sim-small.txt)" >> "$GITHUB_STEP_SUMMARY"
          bash ci/xcodebuild.sh -project ios/AntKingdom.xcodeproj -scheme AntKingdom \
            -destination "platform=iOS Simulator,id=$small" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/AntKingdom-small.xcresult \
            -only-testing:AntKingdomUITests \
            CODE_SIGNING_ALLOWED=NO test

      - name: 导出小屏 UI 截图附件
        if: always()
        run: |
          mkdir -p build/attachments-small
          if [ -d build/AntKingdom-small.xcresult ]; then
            xcrun xcresulttool export attachments --path build/AntKingdom-small.xcresult --output-path build/attachments-small || true
          fi

      - name: 调试场景截图（标准尺寸）
        timeout-minutes: 25
        run: |
          app=build/DerivedData/Build/Products/Debug-iphonesimulator/AntKingdom.app
          for scenario in fresh connected busy pantry_ready replay300 replay600; do
            bash ci/capture-screenshots.sh "$SIM_STANDARD" "$app" build/screenshots "scenario-$scenario" -ak-scenario "$scenario"
          done
          # C06：先在“15 分钟前”保存 connected 场景，再冷启动，走真实离线结算
          bash ci/capture-screenshots.sh "$SIM_STANDARD" "$app" build/screenshots "offline-900s" -ak-scenario connected -ak-away 900

      - name: TestFlight 配置无签名编译（真机架构；调试入口已剔除、未接广告/内购）
        timeout-minutes: 20
        run: |
          set -o pipefail   # 检查失败不能被 tee 吞掉
          bash ci/xcodebuild.sh -project ios/AntKingdom.xcodeproj -scheme AntKingdom \
            -configuration TestFlight -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData-release \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} CODE_SIGNING_ALLOWED=NO build
          bash ci/check-release-binary.sh build/DerivedData-release/Build/Products/TestFlight-iphoneos/AntKingdom.app \
            | tee build/release-check.md >> "$GITHUB_STEP_SUMMARY"
          cat build/release-check.md

      - name: 上传证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-evidence-${{ github.run_number }}
          path: |
            build/environment.md
            build/core-diff.md
            build/release-check.md
            build/swift_core.json
            build/screenshots
            build/attachments
            build/attachments-small
            build/logs
            build/regenerated
            build/videos
          retention-days: 30

      - name: 上传 xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-${{ github.run_number }}
          path: build/AntKingdom.xcresult
          retention-days: 14
