name: iOS 工程与核心包

on:
  push:
    # 只改文档/报告时不占用 macOS runner；PRD 文案变化由 validate.yml 的 export_strings --check 把关
    paths-ignore: ['docs/**', '*.md']
  # 堆叠 PR（基于 claude/* 分支）由 push 运行覆盖，PR 页面同样显示该 commit 的检查；
  # 只有合入 main 的 PR 另跑一次合并结果，避免每个 PR 重复占用 macOS runner。
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODEGEN_VERSION: "2.45.4"

jobs:
  core-linux:
    name: 核心包测试（Linux）
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test --package-path Packages/AntKingdomCore

  d13-roundtrips:
    name: D-13 前后台往返回归（标准与小屏各 10 轮 × 65 秒）
    # 每轮重启到同一可结算状态；任何一轮失败都保留日志，不重跑、不删轮（Issue #11）
    # 新美术候选线 claude/a02-01-art 的每个候选 SHA 也跑（Codex 10-12：不能拿旧 tag 的 20 轮代替新候选）
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/claude/d13-lifecycle' ||
      github.ref == 'refs/heads/claude/a02-01-art'
    runs-on: macos-15
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        run: bash ci/select-xcode.sh

      - name: 构建测试包（Debug，模拟器）
        run: |
          mkdir -p build
          echo "SIM_STANDARD=$(python3 ci/pick_simulator.py standard 2>build/sim-standard.txt)" >> "$GITHUB_ENV"
          echo "SIM_SMALL=$(python3 ci/pick_simulator.py small 2>build/sim-small.txt)" >> "$GITHUB_ENV"
          echo "- 标准：$(cat build/sim-standard.txt)；小屏：$(cat build/sim-small.txt)" >> "$GITHUB_STEP_SUMMARY"
          bash ci/xcodebuild.sh -project ios/AntKingdom.xcodeproj -scheme AntKingdom             -destination "generic/platform=iOS Simulator" -derivedDataPath build/DerivedData             CODE_SIGNING_ALLOWED=NO build-for-testing

      - name: 预热模拟器与 App（冷启动的 XCUITest launch 曾超时，不计入往返轮次）
        run: |
          app=build/DerivedData/Build/Products/Debug-iphonesimulator/AntKingdom.app
          for sim in "$SIM_STANDARD" "$SIM_SMALL"; do
            xcrun simctl boot "$sim" 2>/dev/null || true
            xcrun simctl bootstatus "$sim" -b
            xcrun simctl install "$sim" "$app"
            xcrun simctl launch "$sim" com.example.CrumbKingdom -ak-ephemeral || true
            sleep 8
            xcrun simctl terminate "$sim" com.example.CrumbKingdom || true
          done

      - name: 标准机型 10 轮
        timeout-minutes: 30
        env:
          TEST_RUNNER_AK_ROUNDS: "10"
        run: |
          # 先等模拟器真正启动完成（CI 38186667094 标准机型首轮 launch 报 “Failed to get launch progress”）
          xcrun simctl boot "$SIM_STANDARD" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_STANDARD" -b
          bash ci/xcodebuild.sh -project ios/AntKingdom.xcodeproj -scheme AntKingdom             -destination "platform=iOS Simulator,id=$SIM_STANDARD" -derivedDataPath build/DerivedData             -resultBundlePath build/D13-standard.xcresult             -only-testing:AntKingdomUITests/LifecycleRoundTripUITests             CODE_SIGNING_ALLOWED=NO test-without-building

      - name: 小屏 10 轮
        if: always()
        timeout-minutes: 30
        env:
          TEST_RUNNER_AK_ROUNDS: "10"
        run: |
          # 先等模拟器真正启动完成（CI 38186667094 标准机型首轮 launch 报 “Failed to get launch progress”）
          xcrun simctl boot "$SIM_SMALL" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_SMALL" -b
          bash ci/xcodebuild.sh -project ios/AntKingdom.xcodeproj -scheme AntKingdom             -destination "platform=iOS Simulator,id=$SIM_SMALL" -derivedDataPath build/DerivedData             -resultBundlePath build/D13-small.xcresult             -only-testing:AntKingdomUITests/LifecycleRoundTripUITests             CODE_SIGNING_ALLOWED=NO test-without-building

      - name: 汇总每一轮
        if: always()
        run: |
          grep -h "^D13-ROUND" build/logs/*.log 2>/dev/null | sort -u > build/d13-rounds.txt || true
          {
            echo "### D-13 往返（每轮一行；未删除任何失败轮）"
            echo
            echo '```'
            cat build/d13-rounds.txt
            echo '```'
            echo
            echo "PASS: $(grep -c 'result=PASS' build/d13-rounds.txt || true) / $(wc -l < build/d13-rounds.txt | tr -d ' ')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 导出附件
        if: always()
        run: |
          for kind in standard small; do
            mkdir -p "build/attachments-d13-$kind"
            if [ -d "build/D13-$kind.xcresult" ]; then
              xcrun xcresulttool export attachments --path "build/D13-$kind.xcresult" --output-path "build/attachments-d13-$kind" || true
            fi
          done

      - name: 上传证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d13-evidence-${{ github.run_number }}
          path: |
            build/d13-rounds.txt
            build/sim-standard.txt
            build/sim-small.txt
            build/attachments-d13-standard
            build/attachments-d13-small
            build/logs
          retention-days: 30

  release-track:
    name: 发行轨构建与模拟器测试（macOS）
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        run: bash ci/select-xcode.sh

      - name: 单元 + UI 测试（发行轨 CrumbKingdom，标准尺寸模拟器）
        run: |
          mkdir -p build
          udid=$(python3 ci/pick_simulator.py standard 2>build/sim-release.txt)
          echo "- 发行轨模拟器：$(cat build/sim-release.txt)" >> "$GITHUB_STEP_SUMMARY"
          bash ci/xcodebuild.sh -project ios/AntKingdom.xcodeproj -scheme CrumbKingdom \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/CrumbKingdom.xcresult \
            CODE_SIGNING_ALLOWED=NO test

      - name: 发行轨美术截图（小屏 iPhone SE，A01 / D-15 两个 target 对照）
        if: always()
        timeout-minutes: 15
        run: |
          small=$(python3 ci/pick_simulator.py small 2>build/sim-release-small.txt)
          echo "- 发行轨小屏模拟器：$(cat build/sim-release-small.txt)" >> "$GITHUB_STEP_SUMMARY"
          bash ci/xcodebuild.sh -project ios/AntKingdom.xcodeproj -scheme CrumbKingdom             -destination "platform=iOS Simulator,id=$small"             -derivedDataPath build/DerivedData             -resultBundlePath build/CrumbKingdom-small.xcresult             -only-testing:CrumbKingdomUITests/ReleaseArtScreenshotsUITests             CODE_SIGNING_ALLOWED=NO test

      - name: 导出发行轨 UI 测试截图附件
        if: always()
        run: |
          mkdir -p build/attachments-release build/attachments-release-small
          if [ -d build/CrumbKingdom.xcresult ]; then
            xcrun xcresulttool export attachments --path build/CrumbKingdom.xcresult --output-path build/attachments-release || true
          fi
          if [ -d build/CrumbKingdom-small.xcresult ]; then
            xcrun xcresulttool export attachments --path build/CrumbKingdom-small.xcresult --output-path build/attachments-release-small || true
          fi

      - name: 发行轨 TestFlight 配置无签名编译（调试入口、测试地图、假商店/假广告已剔除；StoreKit + AdMob，不弹 ATT）
        timeout-minutes: 20
        run: |
          set -o pipefail
          bash ci/xcodebuild.sh -project ios/AntKingdom.xcodeproj -scheme CrumbKingdom \
            -configuration TestFlight -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData-release \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} CODE_SIGNING_ALLOWED=NO build
          bash ci/check-release-binary.sh build/DerivedData-release/Build/Products/TestFlight-iphoneos/CrumbKingdom.app --release-track \
            | tee build/release-track-check.md >> "$GITHUB_STEP_SUMMARY"

      - name: 上传发行轨证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.run_number }}
          path: |
            build/sim-release.txt
            build/sim-release-small.txt
            build/release-track-check.md
            build/attachments-release
            build/attachments-release-small
            build/logs
          retention-days: 30

  ios-simulator:
    name: Xcode 构建与模拟器测试（macOS）
    runs-on: macos-15
    # A01/A02/D-16 证据（录像、小屏、两轮截图）加入后整条约 110 分钟（38328225956）；原 75 分钟上限放宽，不删步骤
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        run: bash ci/select-xcode.sh

      - name: 安装锁定版本的 XcodeGen
        run: |
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: 记录构建环境
        run: bash ci/record-environment.sh build/environment.md && cat build/environment.md >> "$GITHUB_STEP_SUMMARY"

      - name: 工程未手改漂移（重新生成后与提交一致）
        run: |
          xcodegen generate --spec ios/project.yml
          if [ -n "$(git status --porcelain -- ios/)" ]; then
            git status --porcelain -- ios/
            git diff -- ios/ | head -n 200
            mkdir -p build/regenerated && cp -R ios/AntKingdom.xcodeproj build/regenerated/
            echo "::error::ios/AntKingdom.xcodeproj 与 project.yml 重新生成的结果不一致；运行 xcodegen generate --spec ios/project.yml 后提交"
            exit 1
          fi

      - name: 核心包测试（macOS）
        run: swift test --package-path Packages/AntKingdomCore

      - name: Python ↔ Swift 差分报告
        run: |
          mkdir -p build
          swift run --package-path Packages/AntKingdomCore ak-sim > build/swift_core.json
          python3 tools/diff_core.py build/swift_core.json build/core-diff.md > /dev/null
          cat build/core-diff.md >> "$GITHUB_STEP_SUMMARY"

      - name: 列出 scheme
        run: xcodebuild -list -project ios/AntKingdom.xcodeproj

      - name: 单元 + UI 测试（标准尺寸模拟器）
        run: |
          udid=$(python3 ci/pick_simulator.py standard 2>build/sim-standard.txt)
          echo "- 标准尺寸模拟器：$(cat build/sim-standard.txt)" >> "$GITHUB_STEP_SUMMARY"
          echo "SIM_STANDARD=$udid" >> "$GITHUB_ENV"
          bash ci/xcodebuild.sh -project ios/AntKingdom.xcodeproj -scheme AntKingdom \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/AntKingdom.xcresult \
            CODE_SIGNING_ALLOWED=NO test

      - name: 导出 UI 测试截图附件
        if: always()
        run: |
          mkdir -p build/attachments
          if [ -d build/AntKingdom.xcresult ]; then
            xcrun xcresulttool export attachments --path build/AntKingdom.xcresult --output-path build/attachments || true
          fi
          ls -la build/attachments || true

      # 交付包放在证据步骤之前：录像 / 小屏 / 截图再长也不会挡住产物上传（CI 38328225956 在 75 分钟上限处被终止，打包被跳过）
      - name: TestFlight 配置无签名编译（真机架构；调试入口已剔除、未接广告/内购）
        timeout-minutes: 20
        run: |
          set -o pipefail   # 检查失败不能被 tee 吞掉
          # 版本/构建号用 project.yml 中固定的值（交付包与源码 tag 一致），不再用 run_number 覆盖
          bash ci/xcodebuild.sh -project ios/AntKingdom.xcodeproj -scheme AntKingdom \
            -configuration TestFlight -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData-release \
            CODE_SIGNING_ALLOWED=NO build
          bash ci/check-release-binary.sh build/DerivedData-release/Build/Products/TestFlight-iphoneos/AntKingdom.app \
            | tee build/release-check.md >> "$GITHUB_STEP_SUMMARY"
          cat build/release-check.md

      - name: 打包无签名构建产物（仅构建证据，不能直接安装）
        timeout-minutes: 20
        run: |
          set -o pipefail
          # Debug 诊断版（含生命周期日志与 Copy Lifecycle Log），真机架构、无签名
          bash ci/xcodebuild.sh -project ios/AntKingdom.xcodeproj -scheme AntKingdom \
            -configuration Debug -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData-device \
            CODE_SIGNING_ALLOWED=NO build
          bash ci/package-unsigned.sh build/unsigned \
            build/DerivedData-release/Build/Products/TestFlight-iphoneos/AntKingdom.app TestFlight \
            build/DerivedData-device/Build/Products/Debug-iphoneos/AntKingdom.app Debug
          cat build/unsigned/BUILD-INFO.md >> "$GITHUB_STEP_SUMMARY"

      - name: 上传无签名构建产物
        uses: actions/upload-artifact@v4
        with:
          name: antkingdom-unsigned-${{ github.sha }}
          path: build/unsigned
          retention-days: 90

      - name: 录制 Pantry 操作录像（模拟器）
        timeout-minutes: 12
        run: |
          mkdir -p build/videos
          xcrun simctl io "$SIM_STANDARD" recordVideo --codec h264 --force build/videos/C05-pantry-flow.mov &
          rec=$!
          sleep 2
          status=0
          bash ci/xcodebuild.sh -project ios/AntKingdom.xcodeproj -scheme AntKingdom             -destination "platform=iOS Simulator,id=$SIM_STANDARD"             -derivedDataPath build/DerivedData             -only-testing:AntKingdomUITests/PantryFlowUITests             CODE_SIGNING_ALLOWED=NO test-without-building || status=$?
          kill -INT "$rec" || true
          wait "$rec" || true
          ls -la build/videos
          exit $status

      - name: 录制 A02 动作检查（工蚁循环与装卸、卵两态与孵化）
        timeout-minutes: 15
        run: |
          app=build/DerivedData/Build/Products/Debug-iphonesimulator/AntKingdom.app
          # eggs_two：两枚卵、孵化订单关闭——已有卵照常倒计时，最后 2 秒切 ready，到点孵化，不新增卵
          bash ci/record-scenario.sh "$SIM_STANDARD" "$app" "build/videos/A02-eggs_two.mov" 32 -ak-scenario eggs_two
          # D-16 E02：左卵 15 秒孵化后新订单占空出的左槽，右卵留在原槽（25 秒孵化后再补右槽）
          bash ci/record-scenario.sh "$SIM_STANDARD" "$app" "build/videos/D16-eggs_refill.mov" 32 -ak-scenario eggs_refill
          # A02-T03：唯一蜿蜒路线，带货一程东南西北四向，总览固定镜头
          bash ci/record-scenario.sh "$SIM_STANDARD" "$app" "build/videos/A02-ant_four_way.mov" 30 -ak-scenario ant_four_way -ak-zoom 0
          xcrun simctl io "$SIM_STANDARD" recordVideo --codec h264 --force build/videos/A02-ant-motion.mov &
          rec=$!
          sleep 2
          status=0
          bash ci/xcodebuild.sh -project ios/AntKingdom.xcodeproj -scheme AntKingdom -destination "platform=iOS Simulator,id=$SIM_STANDARD" -derivedDataPath build/DerivedData -only-testing:AntKingdomUITests/AntMotionUITests CODE_SIGNING_ALLOWED=NO test-without-building || status=$?
          kill -INT "$rec" || true
          wait "$rec" || true
          ls -la build/videos
          exit $status

      - name: 录制 A01 动态检查（食物源有货→耗尽→补给；慢速平移与缩放）
        timeout-minutes: 15
        run: |
          app=build/DerivedData/Build/Products/Debug-iphonesimulator/AntKingdom.app
          for scenario in source_cycle_cookie source_cycle_sugar; do
            bash ci/record-scenario.sh "$SIM_STANDARD" "$app" "build/videos/A01-$scenario.mov" 25 -ak-scenario "$scenario"
          done
          xcrun simctl io "$SIM_STANDARD" recordVideo --codec h264 --force build/videos/A01-pan-zoom.mov &
          rec=$!
          sleep 2
          status=0
          bash ci/xcodebuild.sh -project ios/AntKingdom.xcodeproj -scheme AntKingdom             -destination "platform=iOS Simulator,id=$SIM_STANDARD" -derivedDataPath build/DerivedData             -only-testing:AntKingdomUITests/ArtPanZoomUITests CODE_SIGNING_ALLOWED=NO test-without-building || status=$?
          kill -INT "$rec" || true
          wait "$rec" || true
          ls -la build/videos
          exit $status

      - name: UI 测试（小屏 iPhone SE，最旧已安装 iOS 运行时）
        # A01 美术截图/平移录像加入后，这一步常规耗时 15–17 分钟（run 38205368547 / 38206627796 / 38206625111），
        # m5-ads run 38206933405 在 runner 繁忙时超过原 20 分钟上限被终止；放宽上限，不跳过任何用例
        timeout-minutes: 35
        run: |
          small=$(python3 ci/pick_simulator.py small 2>build/sim-small.txt)
          echo "- 小屏模拟器：$(cat build/sim-small.txt)" >> "$GITHUB_STEP_SUMMARY"
          echo "SIM_SMALL=$small" >> "$GITHUB_ENV"
          bash ci/xcodebuild.sh -project ios/AntKingdom.xcodeproj -scheme AntKingdom \
            -destination "platform=iOS Simulator,id=$small" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/AntKingdom-small.xcresult \
            -only-testing:AntKingdomUITests \
            CODE_SIGNING_ALLOWED=NO test

      - name: 录制 D-16 卵槽位（小屏 E01 / E02）
        if: always() && env.SIM_SMALL != ''
        timeout-minutes: 10
        run: |
          app=build/DerivedData/Build/Products/Debug-iphonesimulator/AntKingdom.app
          mkdir -p build/videos
          bash ci/record-scenario.sh "$SIM_SMALL" "$app" "build/videos/D16-eggs_two-small.mov" 32 -ak-scenario eggs_two
          bash ci/record-scenario.sh "$SIM_SMALL" "$app" "build/videos/D16-eggs_refill-small.mov" 32 -ak-scenario eggs_refill

      - name: 导出小屏 UI 截图附件
        if: always()
        run: |
          mkdir -p build/attachments-small
          if [ -d build/AntKingdom-small.xcresult ]; then
            xcrun xcresulttool export attachments --path build/AntKingdom-small.xcresult --output-path build/attachments-small || true
          fi

      - name: 调试场景截图（标准尺寸）
        timeout-minutes: 25
        run: |
          app=build/DerivedData/Build/Products/Debug-iphonesimulator/AntKingdom.app
          for scenario in fresh connected busy pantry_ready pantry_built replay300 replay600 tunnel_gallery; do
            bash ci/capture-screenshots.sh "$SIM_STANDARD" "$app" build/screenshots "scenario-$scenario" -ak-scenario "$scenario"
          done
          # C06：先在“15 分钟前”保存 connected 场景，再冷启动，走真实离线结算
          bash ci/capture-screenshots.sh "$SIM_STANDARD" "$app" build/screenshots "offline-900s" -ak-scenario connected -ak-away 900

      - name: 上传证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-evidence-${{ github.run_number }}
          path: |
            build/environment.md
            build/core-diff.md
            build/release-check.md
            build/swift_core.json
            build/screenshots
            build/attachments
            build/attachments-small
            build/logs
            build/regenerated
            build/videos
          retention-days: 30

      - name: 上传 xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-${{ github.run_number }}
          path: build/AntKingdom.xcresult
          retention-days: 14
