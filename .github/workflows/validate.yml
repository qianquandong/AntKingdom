name: 规则与文案验证

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python tools/economy_sim.py --check
      - run: python tools/check_map.py
      - run: python tools/check_strings.py
      - run: python tools/export_strings.py --check
      - run: python tools/export_reference.py --check
      - run: python tools/import_art.py --check
      - name: 资源就绪报告（信息性；发行前改用 --strict）
        run: set -o pipefail; python tools/check_assets.py | tee -a "$GITHUB_STEP_SUMMARY"
