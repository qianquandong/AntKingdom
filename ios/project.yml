# XcodeGen 工程定义（锁定 XcodeGen 2.45.4，见 docs/BUILD.md）。
# 生成命令（在仓库根目录）：xcodegen generate --spec ios/project.yml
# 生成结果 ios/AntKingdom.xcodeproj 一并提交；CI 会重新生成并比对，防止手改漂移。
name: AntKingdom
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top
configs:
  Debug: debug
  TestFlight: release
  AppStore: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    # Team 由用户在签名前提供；不在仓库伪造。模拟器构建不需要签名。
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
    TestFlight:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "TESTFLIGHT"
    AppStore:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "APPSTORE"
packages:
  AntKingdomCore:
    path: ../Packages/AntKingdomCore
targets:
  AntKingdom:
    type: application
    platform: iOS
    sources:
      - path: AntKingdom
        excludes:
          - "Resources/**"
      - path: AntKingdom/Resources
        buildPhase: resources
      # 共享运输夹具：Debug 入口用来展示三组固定对照（与 Python 同一份输入）
      - path: ../design/transport_cases.json
        buildPhase: resources
        # 不生成以检出目录命名的父组，保证任何目录名下重新生成都完全一致
        createIntermediateGroups: false
    dependencies:
      - package: AntKingdomCore
        product: AntKingdomCore
    info:
      path: AntKingdom/Info.plist
      properties:
        CFBundleDisplayName: Crumb Kingdom
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # 占位 Bundle ID（example.com 保留域名），签名/TestFlight 前由用户确定真实值。
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CrumbKingdom
        PRODUCT_NAME: AntKingdom
  AntKingdomTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AntKingdomTests
    dependencies:
      - target: AntKingdom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CrumbKingdom.tests
        GENERATE_INFOPLIST_FILE: "YES"
  AntKingdomUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AntKingdomUITests
    dependencies:
      - target: AntKingdom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CrumbKingdom.uitests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  AntKingdom:
    build:
      targets:
        AntKingdom: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AntKingdomTests
        - AntKingdomUITests
    profile:
      config: TestFlight
    analyze:
      config: Debug
    archive:
      config: AppStore
