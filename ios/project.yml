# XcodeGen 工程定义（锁定 XcodeGen 2.45.4，见 docs/BUILD.md）。
# 生成命令（在仓库根目录）：xcodegen generate --spec ios/project.yml
# 生成结果 ios/AntKingdom.xcodeproj 一并提交；CI 会重新生成并比对，防止手改漂移。
name: AntKingdom
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top
configs:
  Debug: debug
  TestFlight: release
  AppStore: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    # 核心测试包构建号：每次交付固定一个值并单调递增
    # 0.1.0 (2) = core-test-d13-2（D-13，占位美术）；0.1.0 (3) = core-art-test-1（A01/A02 共 44 张 + D-15/D-16，Issue #11/#17）
    CURRENT_PROJECT_VERSION: "3"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    # Team 由用户在签名前提供；不在仓库伪造。模拟器构建不需要签名。
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
    TestFlight:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "TESTFLIGHT"
    AppStore:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "APPSTORE"
packages:
  AntKingdomCore:
    path: ../Packages/AntKingdomCore
  # 正式版奖励广告（C12，RELEASE_SCOPE 第 3 章：单一 AdMob + UMP，不加中介网络）。只给发行轨 target 链接。
  # 版本锁定：GoogleMobileAds 13.11.0（2026-09-29），UMP 3.1.0（GoogleMobileAds 要求 1.1.0..<4.0.0）。
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 13.11.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    exactVersion: 3.1.0
targets:
  AntKingdom:
    type: application
    platform: iOS
    sources:
      - path: AntKingdom
        excludes:
          - "Resources/**"
      - path: AntKingdom/Resources
        buildPhase: resources
      # 共享运输夹具：Debug 入口用来展示三组固定对照（与 Python 同一份输入）
      - path: ../design/transport_cases.json
        buildPhase: resources
        # 不生成以检出目录命名的父组，保证任何目录名下重新生成都完全一致
        createIntermediateGroups: false
    dependencies:
      - package: AntKingdomCore
        product: AntKingdomCore
    info:
      path: AntKingdom/Info.plist
      properties:
        CFBundleDisplayName: Crumb Kingdom
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # 占位 Bundle ID（example.com 保留域名），签名/TestFlight 前由用户确定真实值。
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CrumbKingdom
        PRODUCT_NAME: AntKingdom
        # 仅 iPhone。XcodeGen 的 iOS target 默认 "1,2"，会覆盖项目级设置（D-07），必须在 target 上写明
        TARGETED_DEVICE_FAMILY: "1"
        # App 图标是 A06 资源，尚未交付：不放占位图标充数。有了 Assets.xcassets 后 actool 会按默认名 AppIcon 查找并报错，
        # 先置空；A06 app_icon 交付并导入后改回 AppIcon（发行前 check_assets.py --strict 仍会因缺图标失败）
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  AntKingdomTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AntKingdomTests
      # 资源运行时名称约定：单元测试校验与 AssetNames.swift 一致
      - path: ../design/asset_runtime_names.json
        buildPhase: resources
        createIntermediateGroups: false
    dependencies:
      - target: AntKingdom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CrumbKingdom.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  AntKingdomUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AntKingdomUITests
    dependencies:
      - target: AntKingdom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CrumbKingdom.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  # 发行轨（C10 起）：同一份 App 源码 + ReleaseTrack/，编译条件 RELEASE_TRACK。
  # 章节、正式版内容（以及 M5 的商品与奖励广告）只进这个 target；核心验证版 AntKingdom 不含它们。
  CrumbKingdom:
    type: application
    platform: iOS
    sources:
      - path: AntKingdom
        excludes:
          - "Resources/**"
          - "Info.plist"
      - path: AntKingdom/Resources
        buildPhase: resources
      - path: ReleaseTrack
        excludes:
          - "Resources/**"
          - "Info.plist"
          # 本地 StoreKit 测试配置不进 App 包（只给 scheme 运行与单元测试用）
          - "Commerce/Products.storekit"
      - path: ReleaseTrack/Resources
        buildPhase: resources
      - path: ../design/transport_cases.json
        buildPhase: resources
        createIntermediateGroups: false
      # 章节清单与已交付的地图（第二、三章待 Codex A04；新增地图在这里登记）
      - path: ../design/chapters.json
        buildPhase: resources
        createIntermediateGroups: false
      - path: ../design/map_prototype.txt
        buildPhase: resources
        createIntermediateGroups: false
    dependencies:
      - package: AntKingdomCore
        product: AntKingdomCore
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
    info:
      path: ReleaseTrack/Info.plist
      properties:
        CFBundleDisplayName: Crumb Kingdom
        # AdMob：开发/测试用 Google 公布的测试 App ID 与测试奖励单元；正式 ID 由用户的 AdMob 账号提供
        GADApplicationIdentifier: $(GAD_APPLICATION_ID)
        AKRewardedAdUnitID: $(AK_REWARDED_AD_UNIT_ID)
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # 与核心版同一个占位 Bundle ID：正式版是同一款 App 的后续版本（升级沿用存档）
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CrumbKingdom
        PRODUCT_NAME: CrumbKingdom
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) RELEASE_TRACK"
        # Google 测试 ID（https://developers.google.com/admob/ios/test-ads）；AppStore 配置提交前必须换成用户的真实 ID
        GAD_APPLICATION_ID: ca-app-pub-3940256099942544~1458002511
        AK_REWARDED_AD_UNIT_ID: ca-app-pub-3940256099942544/1712485313
        TARGETED_DEVICE_FAMILY: "1"
        # 与核心版相同：A06 app_icon 未交付，共享的 Assets.xcassets 里没有 AppIcon，先置空（发行 strict 检查照常失败）
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  CrumbKingdomTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ReleaseTrackTests
      # SKTestSession(configurationFileNamed: "Products") 从测试包读取
      - path: ReleaseTrack/Commerce/Products.storekit
        buildPhase: resources
      - path: ../design/asset_runtime_names.json
        buildPhase: resources
        createIntermediateGroups: false
    dependencies:
      - target: CrumbKingdom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CrumbKingdom.releasetests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  CrumbKingdomUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ReleaseTrackUITests
    dependencies:
      - target: CrumbKingdom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CrumbKingdom.releaseuitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  CrumbKingdom:
    build:
      targets:
        CrumbKingdom: all
    run:
      config: Debug
      # 本地运行时使用 StoreKit 测试配置（不需要 Apple 账号）；Sandbox/TestFlight 需用户账号
      storeKitConfiguration: ReleaseTrack/Commerce/Products.storekit
    test:
      config: Debug
      targets:
        - CrumbKingdomTests
        - CrumbKingdomUITests
    profile:
      config: TestFlight
    analyze:
      config: Debug
    archive:
      config: AppStore
  AntKingdom:
    build:
      targets:
        AntKingdom: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AntKingdomTests
        - AntKingdomUITests
    profile:
      config: TestFlight
    analyze:
      config: Debug
    archive:
      config: AppStore
